name: Extraer estadísticas y códigos de la EEA
on:
  push:
    branches: [access-rdnfo-20261012]
    paths:
      - ".github/workflows/eea-extraction.yml"
      - "rdnfo_access/explorar_eea.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Descargar EEA 2015-2019 y extraer C00
        run: python3 rdnfo_access/explorar_eea.py
      - uses: actions/upload-artifact@v4
        with:
          name: EEA_Agregados_2015_2019_Reales
          path: eea-salidas/
          retention-days: 30
